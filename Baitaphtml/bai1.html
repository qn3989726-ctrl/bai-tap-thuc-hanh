<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bốn Mùa</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Times New Roman', Times, serif;
            background-color: #FFFFFF;
        }

        /* KHUNG BÀI: Đã tăng chiều rộng và giảm chiều cao tối thiểu */
        main {
            max-width: 900px;       /* Tăng từ 760px lên 900px để rộng hơn */
            min-height: auto;        /* Đổi từ 100vh sang auto để khung ngắn lại vừa vặn nội dung */
            margin: 0 auto;
            padding: 30px 50px;      /* Cân đối lại khoảng cách đệm */
            background-color: #FFFDE7;
            border: 2px solid #9E9E9E;
            box-sizing: border-box;
            text-align: center;
        }

        header {
            background-color: #FFD9E6;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            color: #D40000;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .kho-tho {
            margin: 25px 0;
            font-size: 22px;
            font-style: italic;
            line-height: 1.8;
        }

        .kho-tho p {
            margin: 8px 0;
        }

        .mau-xanh {
            color: #0033CC;
        }

        .mau-do {
            color: #D40000;
        }

        hr {
            border: none;
            border-top: 2px solid #0033CC;
            width: 55%;
            margin: 25px auto;
        }

    </style>
</head>
<body>

    <main>
        <header>
            <h1>BỐN MÙA</h1>
        </header>

        <section>
            <div class="kho-tho mau-xanh">
                <p>Xuân về hoa nở khắp trời</p>
                <p>Hạ sang nắng cháy rạng ngời phố quen</p>
                <p>Thu về lá rụng bên thềm</p>
            </div>

            <hr>

            <div class="kho-tho mau-do">
                <p>Đông sang gió lạnh bên em đợi chờ</p>
                <p>Bốn mùa là bốn giấc mơ</p>
                <p>Thời gian đi mãi ta chờ đợi ai</p>
            </div>

            <hr>

            <div class="kho-tho mau-xanh">
                <p>Một năm rồi lại một năm</p>
                <p>Vẫn còn câu hát thì thầm quê hương</p>
                <p>Chờ xuân nắng mới soi đường</p>
            </div>
        </section>
    </main>

</body>
</html>
