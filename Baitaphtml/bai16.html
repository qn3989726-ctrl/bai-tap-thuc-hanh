<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc cần làm</title>
    <style>
        *
        {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }
        Body
        {
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f1f1f1;
        }
        Main
        {
            width: min(100%, 600px);
            height: 430px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            background: #fff;
            box-shadow: 0 10px 16px rgba(27, 45, 30, 0.12);
            border-radius: 16px;
        }
        header
        {
            width: 100%;
            height: 21%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            padding: 28px;
            text-align: left;
            background: #6d28d9;
            color: #fff;
            border-radius: 16px 16px 0 0;
        }
        header h1, header p
        {
            margin: 0;
        }
        header h1
        {
            font-size: 24px;
        }
        header p
        {
            font-size: 14px;
        }
        fieldset
        {
            width: 100%;
            height: 21%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 0 28px;
            border: none;
            border-bottom: 1px solid #d1d1d1;
        }
        #new-task
        {
            width: 100%;
            height: 46px;
            padding: 0 8px;
            border: 1px solid #d1d1d1;
            border-radius: 8px;
            font-size: 14px;
        }
        #add-button
        {
            width: 88px;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #6d28d9;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        #add-button:hover
        {
            background: #5b21b6;
        }
        #task-list
        {
            width: 100%;
            height: 40%;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 8px 28px;
            overflow-y: auto;
            list-style: none;
            margin: 0;
        }
        #task-list li
        {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px dashed #e5e7eb;
        }
        .task-label
        {
            min-width: 0;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .task-label input
        {
            appearance: none;
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            margin: 0;
            border: 2px solid #a78bfa;
            border-radius: 6px;
            background: #fff;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        .task-label input:checked
        {
            border-color: #6d28d9;
            background: #6d28d9;
        }
        .task-label input:focus-visible
        {
            outline: 2px solid #6d28d9;
            outline-offset: 2px;
        }
        .task-label span
        {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #task-list li.completed .task-label span
        {
            color: #9ca3af;
            text-decoration: line-through;
        }
        .delete-button
        {
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            cursor: pointer;
        }
        .footer
        {
            width: 100%;
            height: 18%;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 0 28px 18px;
        }
        .footer p
        {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 480px)
        {
            Body
            {
                padding: 12px;
                align-items: flex-start;
            }
            Main
            {
                width: 100%;
                height: min(430px, calc(100vh - 24px));
                min-height: 360px;
            }
            header
            {
                height: 24%;
                padding: 16px;
            }
            header h1
            {
                font-size: 22px;
            }
            header p
            {
                font-size: 13px;
            }
            fieldset
            {
                height: 20%;
                padding: 0 16px;
            }
            #new-task
            {
                min-width: 0;
                flex: 1;
            }
            #add-button
            {
                flex: 0 0 76px;
            }
            #task-list
            {
                height: 38%;
                padding: 8px 16px;
            }
            .footer
            {
                height: 18%;
                padding: 0 16px 16px;
            }
        }
        
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Danh sách việc cần làm</h1>
            <p>Thêm việc mới, đánh dấu hoàn thành hoặc xóa &mdash; tất cả bằng JavaScript.</p>
        </header>
        <fieldset>
            <input type="text" id="new-task" placeholder="Nhập việc cần làm">
            <button id="add-button" type="button">Thêm</button>
        </fieldset>
        <ul id="task-list"  aria-live="polite"></ul>
        <section class="footer">
            <p id="remaining-tasks-count">Còn 0 việc chưa hoàn thành</p>
        </section>
    </main>
    <script>
        const newTaskInput = document.getElementById("new-task");
        const addButton = document.getElementById("add-button");
        const taskList = document.getElementById("task-list");
        const remainingTasksCount = document.getElementById("remaining-tasks-count");
        function updateRemainingTasksCount() {
            const remainingTasks = taskList.querySelectorAll("li:not(.completed)").length;
            remainingTasksCount.textContent = `Còn ${remainingTasks} việc chưa hoàn thành`;
        }
        function addTask() {
            const taskText = newTaskInput.value.trim();
            if (taskText === "") {
                return;
            }

            const listItem = document.createElement("li");
            const label = document.createElement("label");
            label.className = "task-label";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.addEventListener("change", () => {
                listItem.classList.toggle("completed", checkbox.checked);
                updateRemainingTasksCount();
            });

            const taskName = document.createElement("span");
            taskName.textContent = taskText;

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Xóa";
            deleteButton.addEventListener("click", () => {
                listItem.remove();
                updateRemainingTasksCount();
            });

            label.append(checkbox, taskName);
            listItem.append(label, deleteButton);
            taskList.appendChild(listItem);
            newTaskInput.value = "";
            updateRemainingTasksCount();
        }
        addButton.addEventListener("click", addTask);
        newTaskInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                addTask();
            }
        });
        updateRemainingTasksCount();
    </script>
</body>
</html>
